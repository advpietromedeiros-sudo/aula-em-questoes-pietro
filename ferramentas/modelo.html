<style>

  --LMP:#7b2d8e;--ADM:#1f4fb4;--z:1}

.ceplac .filtros button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.ce{border:2px solid var(--borda);border-radius:12px;padding:12px 16px;margin:12px 0;background:#fff}

.ce .cab{display:flex;gap:8px;align-items:center;font-size:.72em;font-weight:800;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}

.ce .txt{margin:.4em 0;font-weight:600}

.ce .bts button:hover{background:var(--marca)}

.ce .bts button.esc{opacity:1;background:var(--marca)}
.ce .res{margin-top:8px;font-weight:800}.ce.ok .res{color:var(--verde)}.ce.no .res{color:var(--verm)}
.ce .cm{margin-top:4px;font-size:.88em;border-top:1px dashed #c9cfda;padding-top:6px}
#vis{position:fixed;inset:0;z-index:50;background:#0b0f17;display:none;flex-direction:column}
#vis.on{display:flex}

.vbar button{font:700 15px inherit;font-family:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:9px;padding:8px 12px;cursor:pointer}
.vbar button.x{background:#b3261e;border-color:#b3261e}
#vpalco{flex:1;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;touch-action:none;position:relative}

#vimg{width:100%;height:100%;object-fit:contain;transform-origin:center;user-select:none;transition:transform .12s}

#verr.on{display:block}#verr b{font-weight:800}
@media(max-width:700px){.cartao{padding:16px}.alt{grid-template-columns:38px 1fr}#pontos button{width:26px;height:26px}}
@media print{header,.passo{display:none}.com,.dica{display:block!important}}
</style></head><body>
<header>
  <h1><small>Aula em questões · Prof. Pietro Medeiros</small>__TITULO_CURTO__</h1>
  <nav id="pontos" aria-label="Questões"></nav>
  <span id="placar">Turma: 0 ✓ · 0 ✗</span>
  <div class="ferr"><button id="bRev" title="Revisão visual (V)">📚 Revisão</button><button id="bCapa" title="Lista de questões (Home)">☰</button><button id="bMenos" title="Letra menor (−)">A−</button><button id="bMais" title="Letra maior (+)">A+</button><button id="bTela" title="Tela cheia (F)">⛶</button></div>
</header>
<main id="palco"></main>
<div id="vis" role="dialog" aria-modal="true"><div class="vbar"><span id="vtit"></span><span class="bts">
  <button data-v="ant" title="Anterior (←)">←</button><span id="vnum"></span><button data-v="prox" title="Próxima (→)">→</button>
  <button data-v="menos" title="Diminuir (−)">−</button><button data-v="caber" title="Caber (0)">Caber</button><button data-v="mais" title="Aumentar (+)">+</button>
  <button data-v="err" title="Mostrar/ocultar as correções (C)">⚠ Correções</button><button data-v="fechar" class="x" title="Fechar (Esc)">✕</button></span></div>
  <div id="vpalco"><img id="vimg" alt="" draggable="false"></div><div id="verr"></div></div>
<script id="dados" type="application/json">__DADOS__</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('dados').textContent), Q = D.questoes, L = ['A', 'B', 'C', 'D', 'E'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const neg = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const par = s => String(s).split(/\n\s*\n|\n/).map(t => `<p>${neg(t)}</p>`).join('');
const CHAVE = 'aula-questoes:' + D.titulo;
let st = { q: -1, marc: {}, rev: {}, passo: {}, z: 1 };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(CHAVE) || '{}')); } catch (e) { }
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(st)); } catch (e) { } };
function zoom(v) { st.z = Math.max(.8, Math.min(1.8, Math.round(v * 10) / 10)); document.documentElement.style.setProperty('--z', st.z); salvar(); }

function placar() {
  let ok = 0, no = 0;
  Q.forEach((q, i) => { if (st.rev[i] && st.marc[i]) { if (st.marc[i] === q.gab) ok++; else no++; } });
  $('placar').textContent = `Turma: ${ok} ✓ · ${no} ✗`;
  $('pontos').innerHTML = Q.map((q, i) => {
    const r = st.rev[i] && st.marc[i] ? (st.marc[i] === q.gab ? 'ok' : 'no') : '';
    return `<button class="${q.assunto} ${r} ${i === st.q ? 'cur' : ''}" data-ir="${i}" title="Questão ${i + 1} · ${esc(D.assuntos[q.assunto])}">${i + 1}</button>`;
  }).join('');
}
function capa() {
  st.q = -1; salvar(); placar();
  const grupos = Object.keys(D.assuntos).map(a => `<h3 style="margin:18px 0 0"><span class="rot"><span class="ass ${a}">${esc(D.assuntos[a])}</span></span></h3>` +
    `<div class="lista">${Q.map((q, i) => q.assunto === a ? `<button data-ir="${i}"><span class="n">${i + 1}.</span><span>${esc(q.tema)}${st.rev[i] ? ' ✔' : ''}</span></button>` : '').join('')}</div>`).join('');
  $('palco').innerHTML = `<section class="cartao capa"><div class="rot">Aula em questões · estilo FGV</div><h2>${esc(D.titulo)}</h2><p>${esc(D.subtitulo)}. Base: ${esc(D.base)}</p>${grupos}` +
    `<p class="atalhos"><kbd>→</kbd> avança (revela o gabarito e, depois, um comentário por vez) · <kbd>←</kbd> volta · <kbd>A</kbd>–<kbd>E</kbd> marca a resposta da turma · <kbd>R</kbd> revela tudo · <kbd>+</kbd>/<kbd>−</kbd> letra · <kbd>F</kbd> tela cheia · <kbd>G</kbd> grifos ${R.length || CE.length ? '· <kbd>V</kbd> revisão ' : ''}· <kbd>Home</kbd> esta lista</p>` +
    `<div class="passo">${CE.length ? `<button class="bt sec" id="bRev">📚 Revisão: ${CE.length} itens Certo ou Errado</button>` : R.length ? `<button class="bt sec" id="bRev">📚 Revisão visual (${R.length} imagens)</button>` : '<span></span>'}<button class="bt" data-ir="0">Começar pela questão 1 →</button></div></section>`;
}
function ordemComent(q) { return [q.gab].concat(L.filter(x => x !== q.gab)); }   // primeiro a correta, depois as erradas
function mostrar(rolar) {
  const i = st.q, q = Q[i]; if (!q) return capa();
  const rev = !!st.rev[i], p = st.passo[i] || 0, ord = ordemComent(q), vis = new Set(ord.slice(0, p));
  $('palco').innerHTML = `<section class="cartao" id="qcard"><div class="rot"><span>Questão ${i + 1} de ${Q.length}</span><span class="ass ${q.assunto}">${esc(D.assuntos[q.assunto])}</span><span>${esc(q.tema)}</span></div>` +
    `<div class="enun">${par(q.enunciado)}</div><div class="comando">${neg(q.comando)}</div>` +
    L.map(x => { let c = 'alt'; if (rev) { if (x === q.gab) c += ' certa'; else if (st.marc[i] === x) c += ' errada'; } else if (st.marc[i] === x) c += ' marcada';
      return `<button class="${c}" data-alt="${x}" id="alt${x}"><span class="l">${x}</span><span class="txt">${neg(q.alts[x])}</span><span class="com ${vis.has(x) ? 'on' : ''}" id="com${x}">${neg(q.coment[x])}</span></button>`; }).join('') +
    `<div class="dica ${p > L.length ? 'on' : ''}" id="dica"><b>💡 Dica do professor:</b> ${neg(q.dica)}</div>` +
    `<div class="passo"><button class="bt sec" id="bAnt">← Anterior</button><span>${rev ? (p <= L.length ? `Comentário ${Math.min(p, 5)} de 5` : 'Questão comentada') : (st.marc[i] ? `Turma marcou ${st.marc[i]}` : 'Marque a resposta da turma (A a E)')}</span>` +
    `<button class="bt" id="bProx">${!rev ? 'Revelar gabarito →' : p < L.length ? 'Próximo comentário →' : p === L.length ? 'Dica do professor →' : (i < Q.length - 1 ? 'Próxima questão →' : 'Ver o placar →')}</button></div></section>`;
  placar(); salvar();
  if (rolar) {
    const alvo = !rev ? $('qcard') : p === 0 ? $('alt' + q.gab) : p > L.length ? $('dica') : $('alt' + ord[p - 1]);
    setTimeout(() => alvo && alvo.scrollIntoView({ block: alvo.offsetHeight > innerHeight * .8 ? 'start' : 'center', behavior: 'smooth' }), 40);
  }
}
function ir(i) { st.q = i; mostrar(false); scrollTo(0, 0); }
function fim() {
  st.q = Q.length; salvar(); placar();
  let ok = 0, no = 0, sem = 0; Q.forEach((q, i) => { if (!st.marc[i] || !st.rev[i]) sem++; else if (st.marc[i] === q.gab) ok++; else no++; });
  const por = a => { const idx = Q.map((q, i) => i).filter(i => Q[i].assunto === a); return `${idx.filter(i => st.rev[i] && st.marc[i] === Q[i].gab).length} de ${idx.length}`; };
  $('palco').innerHTML = `<section class="cartao capa"><div class="rot">Fim da aula</div><h2>Placar da turma: ${ok} acerto${ok === 1 ? '' : 's'} em ${Q.length}</h2>` +
    `<p>${Object.keys(D.assuntos).map(a => `<b>${esc(D.assuntos[a])}:</b> ${por(a)}`).join(' · ')}${no ? ` · <b>Erros:</b> ${no}` : ''}${sem ? ` · <b>Sem resposta marcada:</b> ${sem}` : ''}</p>` +
    `<div class="passo"><button class="bt sec" id="bZerar">Zerar respostas</button>${R.length || CE.length ? '<button class="bt sec" id="bRev">📚 Revisão</button>' : ''}<button class="bt" id="bLista">Lista de questões</button></div></section>`;
}
function avancar() {
  const i = st.q; if (i < 0) return ir(0); if (i >= Q.length) return;
  if (!st.rev[i]) { st.rev[i] = 1; st.passo[i] = 0; return mostrar(true); }
  if ((st.passo[i] || 0) <= L.length) { st.passo[i] = (st.passo[i] || 0) + 1; return mostrar(true); }
  if (i < Q.length - 1) ir(i + 1); else fim();
}
function voltar() {
  const i = st.q; if (i >= Q.length) return ir(Q.length - 1); if (i < 0) return;
  if (st.rev[i] && (st.passo[i] || 0) > 0) { st.passo[i]--; return mostrar(true); }
  if (st.rev[i]) { st.rev[i] = 0; return mostrar(true); }
  if (i > 0) { st.q = i - 1; mostrar(false); scrollTo(0, 0); } else capa();
}
function marcar(x) { const i = st.q; if (i < 0 || i >= Q.length || st.rev[i]) return; st.marc[i] = st.marc[i] === x ? undefined : x; mostrar(false); }
function tudo() { const i = st.q; if (i < 0 || i >= Q.length) return; st.rev[i] = 1; st.passo[i] = L.length + 1; mostrar(true); }
/* ---------- revisão visual (imagens do professor, com as correções embaixo) ---------- */
const R = D.revisao || [];
const errHtml = r => r.erratas && r.erratas.length ? `<div class="errata"><b>⚠ Corrija na imagem:</b><ul>${r.erratas.map(e => `<li>${neg(e)}</li>`).join('')}</ul></div>` : `<div class="semerro">✔ Conferida: sem correções.</div>`;
const CE = D.ce || [];
st.ce = st.ce || {}; st.ceF = st.ceF || 'todos';
const ceRot = g => g === 'C' ? 'CERTO' : 'ERRADO';
function ceVisivel(i) { const f = st.ceF, r = st.ce[i];
  return f === 'todos' || f === CE[i].assunto || (f === 'errei' && r && r !== CE[i].gab) || (f === 'faltam' && !r); }
function ceCard(i) { const x = CE[i], r = st.ce[i], cls = r ? (r === x.gab ? 'ok' : 'no') : '';
  return `<div class="ce ${cls}" id="ce${i}"><div class="cab"><span>Item ${i + 1}</span><span class="ass ${x.assunto}">${esc(D.assuntos[x.assunto])}</span></div>` +
    `<div class="txt">${neg(x.texto)}</div><div class="bts">${['C', 'E'].map(g => `<button data-ce="${i}" data-g="${g}" ${r ? 'disabled' : ''} class="${r === g ? 'esc' : ''}">${ceRot(g)}</button>`).join('')}</div>` +
    (r ? `<div class="res">${r === x.gab ? '✔ Você acertou' : '✘ Você errou'} · gabarito: ${ceRot(x.gab)}</div><div class="cm">${neg(x.coment)}</div>` : '') + `</div>`; }
function cePlacar() { let ok = 0, no = 0; const por = {};
  CE.forEach((x, i) => { const r = st.ce[i]; por[x.assunto] = por[x.assunto] || { ok: 0, n: 0 };
    if (r) { por[x.assunto].n++; if (r === x.gab) { ok++; por[x.assunto].ok++; } else no++; } });
  const n = ok + no, F = [['todos', 'Todos'], ...Object.keys(D.assuntos).map(a => [a, D.assuntos[a]]), ['errei', 'Só os que errei'], ['faltam', 'Não respondidos']];
  return `<span class="n">${n}/${CE.length} respondidos</span><span class="n ok">✔ ${ok} acertos</span><span class="n no">✘ ${no} erros</span>` +
    `<span class="n">${n ? Math.round(100 * ok / n) : 0}%</span><span class="por">${Object.keys(por).map(a => `${esc(D.assuntos[a])}: ${por[a].ok} de ${por[a].n}`).join(' · ')}</span>` +
    `<span class="filtros">${F.map(([k, v]) => `<button data-cef="${k}" class="${st.ceF === k ? 'on' : ''}">${esc(v)}</button>`).join('')}<button data-cez="1">Zerar</button></span>`; }
function revisaoCE() {
  st.q = -2; salvar(); placar();
  const lista = CE.map((x, i) => ceVisivel(i) ? ceCard(i) : '').join('');
  $('palco').innerHTML = `<section class="cartao capa"><div class="rot">Revisão · Certo ou Errado</div><h2>${CE.length} itens comentados</h2>` +
    `<p>Julgue cada item como <b>CERTO</b> ou <b>ERRADO</b>. A resposta aparece na hora, com o comentário, e o placar vai contando os seus acertos (fica guardado neste navegador).</p>` +
