<script id="dados" type="application/json">{"titulo": "Aula em Questões · Lei Maria da Penha e Crimes contra a Administração Pública", "subtitulo": "16 questões objetivas no estilo FGV, com todas as alternativas comentadas", "base": "Cadernos do Prof. Pietro Medeiros: Lei Maria da Penha (atualizado até setembro de 2026) e Crimes contra a Administração Pública (STF e STJ até 2025). Leis de 2025 e 2026 conforme o material de aula; confira a redação oficial no Planalto.", "assuntos": {"LMP": "Lei Maria da Penha", "ADM": "Crimes contra a Administração Pública"}, "questoes": [{"assunto": "LMP", "tema": "Âmbito de aplicação · art. 5º · Súmula 600/STJ", "enunciado": "Paula e Rodrigo **namoraram por dois anos**, cada um morando na casa dos próprios pais, e **nunca coabitaram**. Seis meses após o término, Rodrigo, inconformado, aborda Paula na saída da faculdade e a agride com socos, em **via pública**. A defesa sustenta que a Lei nº 11.340/2006 não incide no caso.", "comando": "Diante do exposto, assinale a afirmativa correta.", "alts": {"A": "A lei incide, mas apenas porque houve lesão corporal; se a ofensa fosse só verbal, a falta de coabitação afastaria o art. 5º, III.", "B": "A lei não incide: encerrado o namoro, o vínculo do art. 5º, III, deixa de existir e a agressão passa a ser crime comum, fora do regime da Lei nº 11.340/2006.", "C": "A lei incide, pois o namoro, ainda que encerrado e sem coabitação, é relação íntima de afeto (art. 5º, III; Súmula 600/STJ).", "D": "A lei incide somente se a agressão ocorrer no ambiente doméstico, de modo que o fato praticado em via pública afasta a violência doméstica e familiar.", "E": "A lei não incide se a defesa demonstrar que a motivação foi o ciúme, e não a condição de mulher da vítima."}, "gab": "C", "coment": {"A": "**Errada.** A coabitação **nunca** é exigida (Súm. 600/STJ), qualquer que seja a forma de violência — física, psicológica, moral, patrimonial ou sexual.", "B": "**Errada.** O art. 5º, III, fala em agressor que **conviva ou tenha convivido** com a ofendida: a relação **passada** está protegida.", "C": "**Correta.** Namoro é **relação íntima de afeto**; o inciso III dispensa a coabitação e abrange a relação já encerrada (Súm. 600/STJ).", "D": "**Errada.** O **local não importa**; importa o contexto da relação. A violência “doméstica” da lei não exige que o fato ocorra dentro de casa.", "E": "**Errada.** O **art. 40-A** (Lei 14.550/2023) manda aplicar a lei a todas as situações do art. 5º **independentemente da causa ou da motivação** alegada."}, "dica": "Três “nãos” do âmbito: **não precisa morar junto**, **não precisa estar no relacionamento** e **não precisa ser dentro de casa**."}, {"assunto": "LMP", "tema": "Art. 40-A · sujeitos · mulher trans · STF, Tema 1.412", "enunciado": "Em aula sobre o alcance da Lei Maria da Penha, o professor apresentou as seguintes afirmativas:\n\nI. A agressão do irmão contra a irmã, em discussão sobre a venda da casa herdada dos pais, afasta a lei se a defesa demonstrar que a motivação foi **exclusivamente patrimonial**.\nII. A lei protege a **mulher transexual** vítima de violência no âmbito familiar, pois o critério legal é o **gênero**, e não o sexo biológico.\nIII. Na relação **homoafetiva entre duas mulheres**, a lei pode incidir, sendo **mulher** a agressora.\nIV. Segundo o STF (Tema 1.412), as **medidas protetivas** podem alcançar a violência baseada no gênero praticada por **vizinho sem vínculo afetivo** com a vítima.", "comando": "Está correto o que se afirma em", "alts": {"A": "I e II, apenas.", "B": "II e IV, apenas.", "C": "II, III e IV, apenas.", "D": "I, III e IV, apenas.", "E": "I, II, III e IV."}, "gab": "C", "coment": {"A": "**Errada.** Inclui a afirmativa I, que é falsa: pelo **art. 40-A**, presente o contexto do art. 5º (aqui, o âmbito familiar), a lei se aplica qualquer que seja a causa alegada.", "B": "**Errada.** Deixa de fora a afirmativa III, que é verdadeira: as relações do art. 5º **independem de orientação sexual** (parágrafo único), e a agressora pode ser mulher.", "C": "**Correta.** II: STJ, REsp 1.977.124/SP (o critério é o gênero). III: art. 5º, parágrafo único, e sujeito ativo **qualquer pessoa**. IV: STF, Tema 1.412, para as **medidas protetivas**.", "D": "**Errada.** Inclui a afirmativa I (falsa) e exclui a II (verdadeira).", "E": "**Errada.** A afirmativa I é falsa: a “briga patrimonial” não afasta a lei no âmbito familiar (art. 40-A)."}, "dica": "**Sujeito passivo: mulher** (incluída a mulher trans). **Sujeito ativo: qualquer pessoa.** Cuidado: o Tema 1.412 vale para as **medidas protetivas**; para os demais institutos, continua-se analisando o art. 5º."}, {"assunto": "LMP", "tema": "Formas de violência · art. 7º", "enunciado": "Ana relata na delegacia que o companheiro **esconde seus documentos pessoais e o cartão do salário**, **joga fora seu anticoncepcional** para que ela engravide contra a vontade e a **proíbe de visitar a mãe**, verificando diariamente seu celular. Desde a separação, ele também **maltrata o filho comum** durante as visitas e envia vídeos a Ana dizendo “isso é culpa sua”.", "comando": "À luz do art. 7º da Lei nº 11.340/2006, assinale a afirmativa correta.", "alts": {"A": "Há violência patrimonial e psicológica; os maus-tratos ao filho, por terem a criança como vítima direta, ficam fora da lei e são tratados apenas pelo ECA.", "B": "Há violência moral na retenção dos documentos, psicológica no isolamento e sexual apenas se tivesse havido relação sexual forçada, o que não ocorreu.", "C": "Como o rol do art. 7º é taxativo, só as condutas literalmente descritas nos incisos autorizam medida protetiva, o que exclui o controle do celular.", "D": "Há violência patrimonial, sexual e psicológica contra Ana e, ainda, violência vicária, porque o filho é atingido para ferir a mãe.", "E": "Há violência psicológica, mas o descarte do anticoncepcional, por não envolver contato físico, não caracteriza forma de violência prevista no art. 7º."}, "gab": "D", "coment": {"A": "**Errada.** Violência contra o filho **com vistas a atingir a mulher** é a **violência vicária** (art. 7º, VI, Lei 15.384/2026), 6ª forma da lei; cabe medida protetiva, inclusive suspensão das visitas.", "B": "**Errada.** Reter documentos e salário é violência **patrimonial** (inciso IV), não moral; e impedir o uso de contraceptivo já é violência **sexual** (inciso III), sem necessidade de estupro.", "C": "**Errada.** O caput diz “**entre outras**”: o rol é **exemplificativo**. Além disso, vigilância constante está expressamente no inciso II.", "D": "**Correta.** Patrimonial (documentos e salário), **sexual** (anticoncepcional), psicológica (isolamento e vigilância) e **vicária** (o filho atingido para ferir a mãe).", "E": "**Errada.** O inciso III define como violência sexual a conduta que **impeça o uso de método contraceptivo**, sem exigir contato físico."}, "dica": "Patrimonial = **reter, subtrair, destruir**. Sexual inclui **direitos reprodutivos**. Vicária = ferir quem ela ama **para atingi-la**; matar com esse fim é **vicaricídio** (art. 121-B, hediondo)."}, {"assunto": "LMP", "tema": "Medidas protetivas · natureza e procedimento", "enunciado": "Maria procura a Defensoria Pública dizendo que **não quer processar** o ex-companheiro e **não registrou boletim de ocorrência**, mas tem medo, pois ele ronda sua casa. Ela saiu do imóvel com os dois filhos, foi para outra cidade e está sem renda.", "comando": "Sobre as medidas protetivas de urgência, assinale a afirmativa correta.", "alts": {"A": "A medida protetiva é acessória: sem boletim de ocorrência nem inquérito já instaurado contra o agressor, o pedido deve ser indeferido.", "B": "O juiz pode conceder a medida de imediato, sem ouvir o agressor nem o MP, e ela vigora enquanto persistir o risco, ainda que não haja B.O. nem processo.", "C": "Concedida a medida, ela perde a eficácia em 90 dias se não for ajuizada ação penal.", "D": "O juiz pode conceder auxílio-aluguel a Maria por até 12 meses.", "E": "A matrícula dos filhos na escola mais próxima do novo endereço fica garantida somente se houver vaga disponível na rede pública daquele município."}, "gab": "B", "coment": {"A": "**Errada.** Pela Lei 14.550/2023, a medida independe de **tipificação penal, ação penal, inquérito ou boletim de ocorrência**; não é acessória de processo.", "B": "**Correta.** Art. 19, § 1º (concessão **de imediato**, sem audiência das partes e sem manifestação prévia do MP, que é comunicado) e STJ, **Tema 1.249** (tutela inibitória, vigora **enquanto houver risco**).", "C": "**Errada.** Não há prazo predeterminado: a medida dura **enquanto persistir o risco** (STJ, Tema 1.249).", "D": "**Errada.** O auxílio-aluguel do art. 23, VI, é por período **não superior a 6 meses**.", "E": "**Errada.** O art. 23, V, garante a matrícula ou transferência **independentemente da existência de vaga**."}, "dica": "Medida protetiva **protege, não pune**: sem B.O., sem processo, **48 h** para decidir, **dura enquanto houver risco**. Auxílio-aluguel: **até 6 meses**."}, {"assunto": "LMP", "tema": "Afastamento imediato (art. 12-C) e monitoração eletrônica", "enunciado": "Num sábado à noite, em município de 8 mil habitantes que **não é sede de comarca**, a Polícia Militar atende mulher ameaçada com faca pelo companheiro. **Não há delegado disponível** naquele momento. Semanas antes, o mesmo homem já havia **descumprido** medida protetiva de proibição de contato.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Somente o juiz pode afastar o agressor do lar; à polícia cabe registrar a ocorrência, apreender a faca e aguardar a decisão judicial, que deve sair em até 48 horas.", "B": "O policial pode afastar o agressor na hora, já que o município não é sede de comarca e não há delegado disponível, comunicando o juiz em 24 horas.", "C": "O delegado só pode afastar o agressor quando o município for sede de comarca; não sendo, cabe ao policial fazê-lo, com comunicação ao juiz em 48 horas.", "D": "O afastamento imediato exige risco à vida ou à integridade física, não alcançando o risco à integridade sexual, moral ou patrimonial da mulher.", "E": "Como já houve descumprimento anterior, a monitoração eletrônica deixa de ser cabível, restando ao juiz a decretação da prisão preventiva."}, "gab": "B", "coment": {"A": "**Errada.** O art. 12-C escalona: **juiz** (regra); **delegado**, se o município não for sede de comarca; **policial**, se também não houver delegado disponível.", "B": "**Correta.** Art. 12-C, III, e § 1º: o juiz é comunicado em **24 horas** e decide em **igual prazo** sobre manter ou revogar, com ciência ao MP.", "C": "**Errada.** É o inverso: o delegado atua justamente quando o município **não** é sede de comarca; e a comunicação ao juiz é em **24 horas**.", "D": "**Errada.** A Lei 15.411/2026 ampliou o art. 12-C para o risco à integridade **sexual, moral ou patrimonial**.", "E": "**Errada.** Descumprimento anterior torna a monitoração **prioritária** (art. 22, § 6º, Lei 15.383/2026); deixando de aplicá-la, o juiz deve **fundamentar**."}, "dica": "Afastamento: **juiz → delegado (sem comarca) → policial (sem comarca e sem delegado)**, comunicação em **24 h**. Tornozeleira: **prioridade** se já houve descumprimento."}, {"assunto": "LMP", "tema": "Descumprimento de medida protetiva · art. 24-A", "enunciado": "A **Vara de Família** deferiu medida protetiva proibindo Rafael de manter contato com Clara por qualquer meio. Devidamente intimado, Rafael pede à **irmã** que diga a Clara que “ele vai ficar louco se ela não voltar”. Clara comunica o fato e Rafael é **preso em flagrante**. Na delegacia, o advogado pede o arbitramento de fiança.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "O fato é atípico, pois a medida foi deferida por Vara de Família, e o art. 24-A alcança somente decisões proferidas por juízo criminal.", "B": "Há crime do art. 24-A, mas, como o contato foi indireto, incide a forma privilegiada, punida com detenção e afiançável pelo delegado.", "C": "Rafael responde por desobediência (art. 330 do CP).", "D": "Há o crime do art. 24-A, punido com reclusão de 2 a 5 anos e multa, e somente o juiz pode conceder fiança, ainda que o contato tenha sido indireto.", "E": "O delegado pode arbitrar fiança, porque o contato por interposta pessoa não configura descumprimento direto da medida."}, "gab": "D", "coment": {"A": "**Errada.** Art. 24-A, § 1º: o crime **independe da competência civil ou criminal** do juiz que deferiu a medida.", "B": "**Errada.** Não existe forma privilegiada para o contato indireto: o contato **por interposta pessoa** descumpre a proibição “por qualquer meio”, com a pena do caput, e a fiança é **só judicial**.", "C": "**Errada.** Desde a Lei 13.641/2018 há crime **específico** (art. 24-A); o STJ já entendia que não era desobediência.", "D": "**Correta.** Pena de **reclusão de 2 a 5 anos** e multa (Lei 14.994/2024) e, no flagrante, **somente o juiz** concede fiança (§ 2º).", "E": "**Errada.** O recado pela irmã é descumprimento, e o § 2º veda a fiança pelo delegado."}, "dica": "Art. 24-A: **2 a 5 anos**, **fiança só pelo juiz**, vale para medida **cível ou criminal**. Violar área de exclusão ou tornozeleira: **+1/3 até a metade** (§ 4º)."}, {"assunto": "LMP", "tema": "Ação penal · art. 16 · prazo de 12 meses", "enunciado": "Joana sofreu **lesão corporal** e **ameaça** praticadas pelo companheiro, por razões da condição do sexo feminino. Dias depois, volta à delegacia dizendo que “quer **retirar a queixa**”, porque ele prometeu mudar. Paralelamente, ela é **perseguida** pelo ex-namorado (art. 147-A do CP) há **oito meses** e só agora decide representar.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Joana pode se retratar quanto à lesão e à ameaça, em audiência antes do recebimento da denúncia.", "B": "A ameaça por razões de gênero ainda depende de representação.", "C": "A representação pela perseguição é intempestiva: o prazo decadencial é de seis meses, contados do dia em que a vítima soube quem é o autor.", "D": "A audiência do art. 16 deve ser sempre designada, de ofício, para confirmar a vontade da vítima.", "E": "Lesão e ameaça de gênero são de ação pública incondicionada, e a representação pela perseguição, feita oito meses depois, é tempestiva, pois o prazo passou a ser de 12 meses."}, "gab": "E", "coment": {"A": "**Errada.** Lesão corporal doméstica é **incondicionada** (Súm. 542/STJ) e, desde a Lei 14.994/2024, a ameaça por razões de gênero também: **não há representação a retratar**.", "B": "**Errada.** A Lei 14.994/2024 tornou essa ameaça de **ação pública incondicionada**, com **pena em dobro**.", "C": "**Errada.** A Lei 15.438/2026 ampliou o prazo para **12 meses** nos crimes de violência doméstica de ação condicionada ou privada.", "D": "**Errada.** Pela Lei 15.380/2026, a audiência **só é designada se houver manifestação expressa da vítima**, antes do recebimento da denúncia.", "E": "**Correta.** Lesão e ameaça de gênero: **incondicionadas**. Perseguição: **condicionada**, e a representação aos 8 meses está dentro dos **12 meses**."}, "dica": "Incondicionadas: **lesão** e **ameaça de gênero**. Condicionada: **perseguição**. Prazo para representar ou oferecer queixa: **12 meses**. Audiência do art. 16: **só a pedido dela**."}, {"assunto": "LMP", "tema": "Súmulas do STJ, vedações e prisão preventiva", "enunciado": "Pedro deu um **tapa** na companheira, sem deixar lesão (vias de fato). Na audiência, a defesa pede: (1) **transação penal**; (2) aplicação do **princípio da insignificância**; (3) em caso de condenação, pena de **cesta básica** ou **substituição** da pena privativa de liberdade por restritiva de direitos. O Ministério Público, por sua vez, sustenta que o juiz poderia ter decretado a **prisão preventiva de ofício**, com base no art. 20 da Lei nº 11.340/2006.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Nenhum dos pedidos da defesa procede, e a preventiva não pode ser decretada de ofício, pois prevalece a regra do CPP após o Pacote Anticrime.", "B": "Cabe transação penal, já que as vias de fato são contravenção de menor potencial ofensivo e o art. 41 da Lei nº 11.340/2006 se refere apenas a crimes.", "C": "Aplica-se a insignificância, porque o tapa não deixou lesão e o desvalor do resultado foi mínimo.", "D": "Embora vedada a cesta básica, é possível substituir a pena privativa de liberdade por restritiva de direitos, já que as vias de fato não produziram lesão corporal.", "E": "O juiz pode decretar a preventiva de ofício, pois o art. 20 da Lei Maria da Penha, norma especial, prevalece sobre o CPP."}, "gab": "A", "coment": {"A": "**Correta.** Súm. **536** (sem transação nem sursis processual), **589** (sem insignificância), **588** (sem restritiva com violência) e art. **17** (sem cesta básica). E prevalece no STF e no STJ a **vedação da preventiva de ofício** (CPP, arts. 282, § 2º, e 311).", "B": "**Errada.** A Súmula 536/STJ fala em “delitos sujeitos ao rito da Lei Maria da Penha”, e o STJ a aplica também às **contravenções** praticadas nesse contexto.", "C": "**Errada.** **Súmula 589/STJ**: é inaplicável a insignificância nos crimes **e contravenções** contra a mulher no âmbito doméstico.", "D": "**Errada.** A **Súmula 588/STJ** impede a substituição quando há **violência** ou grave ameaça — e o tapa é violência, ainda que sem lesão.", "E": "**Errada.** Apesar da redação do art. 20, o entendimento dominante após a Lei 13.964/2019 veda a preventiva de ofício."}, "dica": "Portas fechadas: **sem Lei 9.099** (art. 41; Súm. 536), **sem insignificância** (Súm. 589), **sem restritiva com violência** (Súm. 588), **sem cesta básica** (art. 17). Preventiva: **não de ofício**."}, {"assunto": "ADM", "tema": "Funcionário público para fins penais · art. 327 · Súmula 599", "enunciado": "Sobre o conceito de funcionário público para fins penais e a teoria geral dos crimes contra a Administração Pública, analise as afirmativas:\n\nI. O **estagiário** de órgão público e o **advogado dativo** são funcionários públicos para fins penais, ainda que não remunerados pelos cofres públicos.\nII. O **depositário judicial** de bens particulares penhorados é, em regra, equiparado a funcionário público e responde por peculato se deles se apropriar.\nIII. A causa de aumento de um terço do art. 327, § 2º, alcança o dirigente de **autarquia**, por integrar a administração indireta.\nIV. Segundo a Súmula 599 do STJ, o princípio da insignificância é inaplicável ao **peculato**, à **concussão** e à **corrupção**, ainda que o valor envolvido seja ínfimo.", "comando": "Está correto o que se afirma em", "alts": {"A": "I e IV, apenas.", "B": "I e II, apenas.", "C": "II e III, apenas.", "D": "I, III e IV, apenas.", "E": "I, II, III e IV."}, "gab": "A", "coment": {"A": "**Correta.** I: art. 327, caput, “**embora transitoriamente ou sem remuneração**” (STJ: estagiário e dativo). IV: **Súmula 599/STJ**, que não abre exceção pelo valor nesses crimes funcionais.", "B": "**Errada.** A afirmativa II é falsa: o depositário judicial recebe um **múnus** do juízo e **não** é funcionário público, nem em regra (STJ, HC 402.949/SP).", "C": "**Errada.** II e III são falsas. O § 2º não menciona **autarquia**, e a analogia *in malam partem* é vedada (STF, AO 2.093/RN).", "D": "**Errada.** Inclui a afirmativa III, que é falsa.", "E": "**Errada.** II e III são falsas."}, "dica": "O critério é a **função exercida**, não o vínculo. § 2º: **direta, SEM, empresa pública e fundação**, **sem autarquia**. Súm. 599 tem exceções: **descaminho** e **cigarros até 1.000 maços**."}, {"assunto": "ADM", "tema": "Peculato e emprego irregular de verbas · arts. 312 e 315", "enunciado": "Carla, servidora do **setor de RH** de uma secretaria municipal, usa seu crachá para entrar à noite no **depósito da merenda escolar**, que **não está sob sua guarda**, e leva caixas de leite em pó para revender. No mesmo órgão, o tesoureiro **deixa o cofre aberto** ao sair para almoçar, e um visitante subtrai o dinheiro. Já o secretário, sem qualquer proveito pessoal, aplica verba vinculada por lei à reforma de uma UBS na **recuperação de uma ponte**.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Carla comete peculato-apropriação; o tesoureiro, peculato culposo; e o secretário, peculato-desvio.", "B": "Carla comete peculato-furto; o tesoureiro, peculato culposo; e o secretário, emprego irregular de verbas públicas.", "C": "Carla comete peculato-furto; o tesoureiro e o visitante são coautores de peculato culposo; e o secretário não comete crime, pois não teve proveito pessoal.", "D": "Carla comete furto qualificado, por não ter a posse dos bens; e o tesoureiro extingue a punibilidade se reparar o dano a qualquer tempo, mesmo após o trânsito em julgado.", "E": "Carla comete peculato-furto, e o secretário, peculato-desvio, ao dar à verba pública destino diverso do previsto em lei."}, "gab": "B", "coment": {"A": "**Errada.** Carla **não tinha a posse** dos bens (peculato-furto, não apropriação); e o desvio do secretário, sem proveito pessoal e em favor da própria Administração, é **art. 315**, não peculato-desvio.", "B": "**Correta.** Peculato-furto (sem posse, valendo-se da **facilidade** do cargo – art. 312, § 1º); **peculato culposo** do tesoureiro (§ 2º); e **emprego irregular de verbas** (art. 315; STF, Inq 3.731/DF).", "C": "**Errada.** Não há concurso de pessoas entre crime culposo e doloso: o visitante responde por **furto**. E o secretário comete o **art. 315**, que dispensa proveito pessoal.", "D": "**Errada.** Valer-se da facilidade do cargo faz o crime ser **peculato-furto**; e, após a sentença irrecorrível, a reparação só **reduz a pena pela metade** (§ 3º).", "E": "**Errada.** O peculato-desvio exige proveito **próprio ou alheio**; aplicar a verba em outra finalidade **pública** é o art. 315."}, "dica": "**Tem posse** → apropriação ou desvio. **Não tem posse, usa a facilidade** → furto. **Descuidou** → culposo (repara antes da sentença irrecorrível: extingue). **Desvio para a própria Administração** → art. 315."}, {"assunto": "ADM", "tema": "Concussão, excesso de exação e corrupção passiva", "enunciado": "Fiscal da vigilância sanitária, em vistoria numa lanchonete, diz ao dono: “Encontrei irregularidades. **Ou você me dá R$ 1.500 até sexta**, ou interdito o estabelecimento”. O comerciante procura a polícia, e o fiscal é surpreendido ao **receber o envelope na sexta-feira**. Em outra situação, um agente fiscal recebe o ISS **devido** pago por uma feirante e **embolsa o valor**.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "O fiscal sanitário pratica corrupção passiva, consumada com o recebimento do envelope, momento em que a prisão em flagrante é legítima.", "B": "O fiscal sanitário pratica extorsão, e o comerciante, ao entregar o envelope, corrupção ativa.", "C": "O fiscal sanitário consumou concussão ao exigir o dinheiro; a entrega é exaurimento.", "D": "O agente que embolsa o ISS devido pratica excesso de exação qualificado (art. 316, § 2º), e não peculato, dada a natureza tributária do valor.", "E": "A concussão continua com pena menor que a da corrupção passiva, porque a Lei nº 13.964/2019 só elevou a pena desta última."}, "gab": "C", "coment": {"A": "**Errada.** Houve **exigência** com intimidação (“ou paga, ou interdito”), não mera solicitação: é **concussão**, já consumada antes da entrega.", "B": "**Errada.** Extorsão exige **violência ou grave ameaça**; aqui o temor decorre do **poder do cargo**. O comerciante é **vítima**, não comete corrupção ativa.", "C": "**Correta.** Concussão é **formal**: consuma-se com a exigência; a entrega é **exaurimento** e, por si só, não gera flagrante (STJ, HC 266.460/ES, Info 564).", "D": "**Errada.** O § 2º pressupõe tributo **indevido** desviado. Apropriar-se de tributo **devido** é **peculato**.", "E": "**Errada.** O Pacote Anticrime elevou a pena da **concussão** para **2 a 12 anos**, igualando-a à da corrupção passiva."}, "dica": "**Exigir** = concussão. **Solicitar** = corrupção passiva. **Violência ou grave ameaça** = extorsão. Tributo **devido** embolsado = peculato; **indevido** desviado = 316, § 2º."}, {"assunto": "ADM", "tema": "Corrupção ativa, corrupção privilegiada e prevaricação", "enunciado": "Considere as situações: (1) flagrado com um cigarro de maconha, Lucas **oferece R$ 200** ao policial para “esquecer o caso”, mas o policial **recusa** e o conduz à delegacia; (2) o agente de trânsito **pede R$ 300** a um motorista sem CNH, que **paga**; (3) a pedido de um **vereador amigo**, sem receber vantagem, um servidor passa o processo do eleitor dele à frente da fila; (4) correição encontra centenas de boletins parados numa delegacia, por **desorganização e comodismo** do delegado.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Em (1), não há crime, porque o policial recusou a oferta; em (3), há prevaricação; em (4), há prevaricação.", "B": "Em (1), há corrupção ativa; em (2), o motorista também comete corrupção ativa, na modalidade dar; em (4), há prevaricação.", "C": "Em (2), apenas o agente responde, por corrupção passiva; em (3), há prevaricação, por interesse pessoal do servidor; em (4), há prevaricação, porque o dolo de omitir basta.", "D": "Em (1), há corrupção ativa consumada; em (3), corrupção passiva privilegiada; em (4), a desídia não basta para a prevaricação.", "E": "Em (1), há tentativa de corrupção ativa; em (3), corrupção passiva privilegiada; em (4), condescendência criminosa."}, "gab": "D", "coment": {"A": "**Errada.** A corrupção ativa é **formal** e se consuma com a ciência da oferta, mesmo recusada (STJ, Info 735); (3) e (4) também estão errados.", "B": "**Errada.** O art. 333 não tem o núcleo **dar**: quando a iniciativa é do funcionário, quem paga não comete corrupção ativa; e (4) não é prevaricação.", "C": "**Errada.** O início está certo (só o agente responde em (2)), mas (3) é **corrupção passiva privilegiada** (pedido de **outrem**) e, em (4), o dolo genérico **não basta** (STJ, Info 846).", "D": "**Correta.** (1) ativa **consumada** com a oferta; (3) art. 317, § 2º; (4) desídia e comodismo não revelam o **fim especial** da prevaricação (STJ, AgRg no AREsp 2.693.820/SP, Info 846).", "E": "**Errada.** Em (1) o crime está **consumado**, não tentado; e (4) não é condescendência, que pressupõe deixar de responsabilizar **subordinado**."}, "dica": "Ativa: **oferecer/prometer**, sem “dar”. Pedido de **outrem** = 317, § 2º. Sentimento **pessoal** = 319. **Preguiça não é prevaricação.**"}, {"assunto": "ADM", "tema": "Resistência, desobediência, desacato, tráfico de influência e exploração de prestígio", "enunciado": "Durante policiamento ostensivo noturno, um motociclista **ignora a ordem de parada** da viatura e foge. Detido, **deita-se no chão** e se agarra a uma grade para não ser algemado, sem agredir ninguém. Na delegacia, **xinga três policiais** de uma só vez. Dias depois, um vizinho do preso pede a ele cinco salários mínimos **a pretexto de influir no depoimento de uma testemunha**, insinuando que parte iria para ela.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "A fuga é atípica, por ser mera infração de trânsito; agarrar-se à grade configura resistência; há três desacatos; o vizinho comete exploração de prestígio.", "B": "A fuga é desobediência; agarrar-se à grade configura resistência; há desacato único; o vizinho comete tráfico de influência, com aumento da metade.", "C": "A fuga é desobediência; a resistência passiva é atípica; há três desacatos em concurso formal; o vizinho comete tráfico de influência.", "D": "A fuga é atípica, por ser mera infração de trânsito; a resistência passiva é atípica; há desacato único; o vizinho comete exploração de prestígio, com aumento de um terço.", "E": "A fuga é desobediência; a resistência passiva é atípica; há desacato único; o vizinho comete exploração de prestígio, com aumento de um terço."}, "gab": "E", "coment": {"A": "**Errada.** Em policiamento **ostensivo**, a fuga à ordem de parada é **desobediência** (STJ, Tema 1.060); resistência exige violência ou ameaça; e o desacato é **único**.", "B": "**Errada.** A **resistência passiva** é atípica; e influir em **testemunha** é **exploração de prestígio** (art. 357), não tráfico de influência.", "C": "**Errada.** O desacato a vários policiais no mesmo contexto é **crime único** (STJ, AgRg no RHC 136.918/SP); e o vizinho comete o art. 357.", "D": "**Errada.** Tudo certo, menos a fuga: o caso é de **policiamento ostensivo**, não de fiscalização de trânsito, e o STJ (Tema 1.060) vê **desobediência**.", "E": "**Correta.** Tema 1.060 (desobediência); resistência passiva **atípica**; desacato **único**; art. 357, parágrafo único (**+1/3** por insinuar que a vantagem vai para a testemunha)."}, "dica": "Ordem de parada: **ostensivo = crime**; **trânsito = infração administrativa**. Resistência exige **violência ou ameaça**. Funcionário em geral = **332 (+ metade)**; juiz, testemunha e afins = **357 (+ 1/3)**."}, {"assunto": "ADM", "tema": "Descaminho, contrabando e sonegação previdenciária", "enunciado": "Um “sacoleiro” volta do Paraguai com **30 celulares** escondidos em fundo falso, sem declarar à Receita, iludindo R$ 9.000,00 em tributos; é a **primeira** vez que responde por fato do gênero. Uma tabacaria do bairro expõe à venda **400 maços** de cigarros paraguaios sem registro na Anvisa e **15 cigarros eletrônicos**. Uma empresária mantém 25 empregados “por fora”, **omitindo-os da GFIP**.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "O sacoleiro comete contrabando, porque os celulares entraram no país de forma clandestina, escondidos em fundo falso.", "B": "Cabe a insignificância para o sacoleiro e para os 400 maços, mas não para os cigarros eletrônicos, e a empresária responde pelo art. 337-A.", "C": "Se o sacoleiro pagar o tributo antes da denúncia, extingue-se a punibilidade.", "D": "A insignificância alcança todos os produtos da tabacaria, inclusive os 15 cigarros eletrônicos, pois nenhuma das quantidades supera o limite de mil unidades fixado pelo STJ.", "E": "A empresária comete apropriação indébita previdenciária (art. 168-A), admitida a continuidade delitiva com a sonegação previdenciária."}, "gab": "B", "coment": {"A": "**Errada.** Celular é mercadoria **permitida**; iludir o tributo é **descaminho** (art. 334). Contrabando envolve mercadoria **proibida**.", "B": "**Correta.** Descaminho até **R$ 20 mil**, sem reiteração (REsp 1.709.029/MG; Tema 1.218); cigarros até **1.000 maços** (Tema 1.143); **vape sem insignificância** (STJ, Info 853); omitir segurados da GFIP é o **art. 337-A, I**.", "C": "**Errada.** Para o STJ, o pagamento **não** extingue a punibilidade do descaminho, crime **formal** que tutela também o controle aduaneiro.", "D": "**Errada.** O parâmetro de 1.000 maços **não se estende** aos cigarros eletrônicos (STJ, AgRg no REsp 2.184.785/PR).", "E": "**Errada.** Omitir segurados é **fraude na informação** (337-A), não falta de repasse do descontado (168-A); e o STJ **não admite continuidade** entre as duas figuras."}, "dica": "**Permitida** + tributo iludido = descaminho (1 a 4 anos). **Proibida** = contrabando (2 a 5 anos). Não repassar = **168-A**; fraudar a informação = **337-A**."}, {"assunto": "ADM", "tema": "Crimes em licitações e contratos · arts. 337-E a 337-P", "enunciado": "Em município do interior: (1) empresas combinam previamente quem vencerá cada pregão, apresentando “propostas de cobertura”, sem que se apure prejuízo ao erário; (2) o secretário deixa vencer o contrato de limpeza dos hospitais e contrata **diretamente**, por “emergência”, a empresa do sobrinho do prefeito; (3) a contratada para fornecer merenda em pacotes de 10 kg entrega pacotes de 9 kg, **faturando 10 kg**; (4) a sentença fixa a pena de multa.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Em (1), há frustração do caráter competitivo, crime formal; em (2), contratação direta ilegal; em (3), fraude em contrato (art. 337-L).", "B": "Em (1), não há crime sem prejuízo ao erário; em (2), contratação direta ilegal; em (3), fraude em contrato; em (4), a multa tem teto de 2% do contrato.", "C": "Em (1), frustração do caráter competitivo; em (2), fato atípico, pela emergência; em (3), mero inadimplemento contratual.", "D": "Em (1), frustração do caráter competitivo; em (2), contratação direta ilegal; em (4), a multa não pode superar 2% do valor do contrato.", "E": "Em (1), perturbação de processo licitatório; em (2), contratação direta ilegal; em (3), fraude em contrato; em (4), multa com piso de 2%."}, "gab": "A", "coment": {"A": "**Correta.** Cartel com propostas de cobertura frustra a competição (337-F, **formal** – Súm. 645/STJ); a contratação direta fora das hipóteses legais é o 337-E; entregar quantidade menor faturando a maior é o 337-L, I.", "B": "**Errada.** O 337-F é **formal** (Súm. 645/STJ) e dispensa prejuízo; e os 2% do art. 337-P são **piso**, não teto.", "C": "**Errada.** A **emergência fabricada** pela má gestão não legitima a dispensa; e faturar 10 kg entregando 9 kg é **fraude**, não mero inadimplemento.", "D": "**Errada.** O art. 337-P diz que a multa “não poderá ser **inferior**” a 2%: é piso.", "E": "**Errada.** O cartel com propostas combinadas frustra o **caráter competitivo** (337-F); “perturbar” o processo (337-I) é outra conduta, e é subsidiária."}, "dica": "Os “4 a 8 anos”: **E–F–H–L**. **337-F é formal** (Súm. 645); **337-L exige prejuízo**. Multa: **piso de 2%** do contrato."}, {"assunto": "ADM", "tema": "Crimes contra a Administração da Justiça · arts. 338-A a 352", "enunciado": "Analise as situações: (1) após a absolvição de um réu, o autor da notícia-crime é denunciado por **denunciação caluniosa** apenas porque a acusação não se comprovou; (2) uma testemunha mente em juízo para ajudar o amigo réu, instruída pelo advogado deste, e **se retrata antes da sentença**; (3) a **mãe** esconde o filho foragido em casa e o **irmão** dele guarda o dinheiro do roubo para entregá-lo depois; (4) um preso foge pela porta da cela, deixada aberta, **sem violência**; (5) preso em flagrante pelo descumprimento de medida protetiva deferida em favor de **idosa** (art. 338-A do CP), o autor requer fiança ao delegado.", "comando": "Assinale a afirmativa correta.", "alts": {"A": "Em (1), a absolvição do réu basta para a condenação por denunciação caluniosa; em (4), a fuga sem violência é o crime do art. 352.", "B": "Em (2), a retratação beneficia a testemunha, mas não o advogado; em (3), só a mãe fica isenta de pena.", "C": "Em (3), mãe e irmão ficam isentos de pena; em (5), o delegado pode arbitrar fiança.", "D": "Em (3), só a mãe fica isenta de pena; em (4), não há crime; e, em (5), somente o juiz pode conceder fiança.", "E": "Em (2), a retratação beneficia testemunha e advogado; em (5), o delegado pode arbitrar fiança, pois o art. 338-A não repete a vedação da Lei Maria da Penha."}, "gab": "D", "coment": {"A": "**Errada.** A denunciação caluniosa exige **dolo direto** (saber que o imputado é inocente); a absolvição, por si só, não prova a má-fé (STF, Inq 3.133/AC). E o art. 352 exige **violência contra a pessoa**.", "B": "**Errada.** A parte (3) está certa, mas a **retratação se estende aos partícipes** do falso testemunho (STJ, HC 36.287/SP).", "C": "**Errada.** O irmão que guarda o **proveito** do roubo pratica favorecimento **real** (art. 349), **sem escusa**; e a fiança no art. 338-A é **só judicial**.", "D": "**Correta.** (3) a escusa do art. 348, § 2º, vale só para o favorecimento **pessoal**; (4) fuga sem violência é **falta grave**, não crime; (5) art. 338-A, § 2º (Lei 15.280/2025): **somente o juiz** concede fiança.", "E": "**Errada.** A primeira parte está certa, mas o art. 338-A, § 2º, **repete** a reserva da fiança à autoridade judicial."}, "dica": "Denunciação caluniosa: **dolo direto**. Falso testemunho: retratação **até a sentença**, vale para o **partícipe**. Escusa familiar: **só no favorecimento pessoal**. Fuga sem violência: **não é crime**."}], "revisao": [{"arquivo": "lmp-1-fundamentos.jpg", "assunto": "LMP", "titulo": "Lei Maria da Penha · fundamentos, proteção e resposta", "erratas": []}, {"arquivo": "lmp-2-revisao-visual.jpg", "assunto": "LMP", "titulo": "Lei Maria da Penha · revisão visual", "erratas": ["Desde 2026 são **seis** formas de violência, e não cinco: a **vicária** entrou no art. 7º, VI (Lei 15.384/2026).", "A **monitoração eletrônica** é medida protetiva do **art. 22, VIII** (Lei 15.383/2026). O **art. 24-A** é o **crime de descumprimento** (reclusão de 2 a 5 anos).", "Audiência do **art. 16**: só nos crimes de ação **condicionada** e só se a vítima pedir **expressamente** (Lei 15.380/2026)."]}, {"arquivo": "adm-1-teoria-geral.jpg", "assunto": "ADM", "titulo": "Administração Pública · teoria geral e pontos-chave", "erratas": ["No quadro de abertura, o nome é **Bruno Paiva** (está grafado “Benno”)."]}, {"arquivo": "adm-2-revisao-visual.jpg", "assunto": "ADM", "titulo": "Administração Pública · revisão visual completa", "erratas": ["**Contratação direta ilegal** é o **art. 337-E**; o 337-G é o patrocínio de contratação indevida.", "**Insignificância**: em regra **inaplicável** aos crimes contra a Administração Pública (**Súmula 599/STJ**); exceções: **descaminho** até R$ 20 mil e **cigarros** até 1.000 maços.", "**Progressão de regime**: há regra específica, sim — fica **condicionada à reparação do dano** ou à devolução do produto do ilícito (**art. 33, § 4º**).", "**Desacato** protege o **prestígio da função**, não a honra pessoal do servidor (STF, ADPF 496)."]}, {"arquivo": "adm-3-crimes-em-quadrinhos.jpg", "assunto": "ADM", "titulo": "Administração Pública · os crimes em quadrinhos", "erratas": ["**Concussão**: a pena hoje é de **2 a 12 anos** e multa (Lei 13.964/2019), não 2 a 8.", "**Peculato de uso** de bem infungível (carro oficial devolvido intacto) é, em regra, **atípico** (STF, HC 108.433 AgR); é crime para o **prefeito** (DL 201/67, art. 1º, II)."]}, {"arquivo": "adm-4-capitulo-i.jpg", "assunto": "ADM", "titulo": "Administração Pública · principais crimes do Capítulo I", "erratas": ["**Concussão**: a pena hoje é de **2 a 12 anos** e multa (Lei 13.964/2019), não 2 a 8.", "**Peculato de uso** de bem infungível é, em regra, **atípico** (STF, HC 108.433 AgR); exceção: **prefeito** (DL 201/67).", "O **Capítulo II-A** (arts. 337-B a 337-D) trata dos crimes contra a **Administração Pública estrangeira**, não de “vantagem a árbitro”.", "Não admitem tentativa, além do peculato culposo, os **omissivos próprios** (ex.: arts. 319-A e 320)."]}, {"arquivo": "adm-5-aula-de-revisao.jpg", "assunto": "ADM", "titulo": "Administração Pública · aula de revisão", "erratas": ["**Concussão**: a pena hoje é de **2 a 12 anos** e multa (Lei 13.964/2019), não 2 a 8.", "O aumento do **art. 327, § 2º** (1/3) é para ocupante de **cargo em comissão** ou de **função de direção ou assessoramento** — não para crime “contra a Justiça, a Saúde ou em calamidade”.", "**Corrupção passiva privilegiada** (art. 317, § 2º) é ceder a **pedido ou influência de outrem**, sem vantagem — não é “vantagem de pequeno valor”.", "A reparação do dano antes da sentença irrecorrível **extingue a punibilidade só no peculato culposo** (art. 312, § 3º); não há essa regra na corrupção passiva privilegiada.", "A referência “**Tema 1.089** do STF” não foi localizada no material de aula: confira antes de citar."]}]}</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('dados').textContent), Q = D.questoes, L = ['A', 'B', 'C', 'D', 'E'];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const neg = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
const par = s => String(s).split(/\n\s*\n|\n/).map(t => `<p>${neg(t)}</p>`).join('');
const CHAVE = 'aula-questoes:' + D.titulo;
let st = { q: -1, marc: {}, rev: {}, passo: {}, z: 1 };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(CHAVE) || '{}')); } catch (e) { }
const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(st)); } catch (e) { } };
function zoom(v) { st.z = Math.max(.8, Math.min(1.8, Math.round(v * 10) / 10)); document.documentElement.style.setProperty('--z', st.z); salvar(); }

function placar() {
  let ok = 0, no = 0;
  Q.forEach((q, i) => { if (st.rev[i] && st.marc[i]) { if (st.marc[i] === q.gab) ok++; else no++; } });
  $('placar').textContent = `Turma: ${ok} ✓ · ${no} ✗`;
  $('pontos').innerHTML = Q.map((q, i) => {
    const r = st.rev[i] && st.marc[i] ? (st.marc[i] === q.gab ? 'ok' : 'no') : '';
    return `<button class="${q.assunto} ${r} ${i === st.q ? 'cur' : ''}" data-ir="${i}" title="Questão ${i + 1} · ${esc(D.assuntos[q.assunto])}">${i + 1}</button>`;
  }).join('');
}
function capa() {
  st.q = -1; salvar(); placar();
  const grupos = Object.keys(D.assuntos).map(a => `<h3 style="margin:18px 0 0"><span class="rot"><span class="ass ${a}">${esc(D.assuntos[a])}</span></span></h3>` +
    `<div class="lista">${Q.map((q, i) => q.assunto === a ? `<button data-ir="${i}"><span class="n">${i + 1}.</span><span>${esc(q.tema)}${st.rev[i] ? ' ✔' : ''}</span></button>` : '').join('')}</div>`).join('');
  $('palco').innerHTML = `<section class="cartao capa"><div class="rot">Aula em questões · estilo FGV</div><h2>${esc(D.titulo)}</h2><p>${esc(D.subtitulo)}. Base: ${esc(D.base)}</p>${grupos}` +
    `<p class="atalhos"><kbd>→</kbd> avança (revela o gabarito e, depois, um comentário por vez) · <kbd>←</kbd> volta · <kbd>A</kbd>–<kbd>E</kbd> marca a resposta da turma · <kbd>R</kbd> revela tudo · <kbd>+</kbd>/<kbd>−</kbd> letra · <kbd>F</kbd> tela cheia · <kbd>G</kbd> grifos · <kbd>V</kbd> revisão visual · <kbd>Home</kbd> esta lista</p>` +
    `<div class="passo">${R.length ? `<button class="bt sec" id="bRev">📚 Revisão visual (${R.length} imagens)</button>` : '<span></span>'}<button class="bt" data-ir="0">Começar pela questão 1 →</button></div></section>`;
}
function ordemComent(q) { return [q.gab].concat(L.filter(x => x !== q.gab)); }   // primeiro a correta, depois as erradas
function mostrar(rolar) {
  const i = st.q, q = Q[i]; if (!q) return capa();
  const rev = !!st.rev[i], p = st.passo[i] || 0, ord = ordemComent(q), vis = new Set(ord.slice(0, p));
  $('palco').innerHTML = `<section class="cartao" id="qcard"><div class="rot"><span>Questão ${i + 1} de ${Q.length}</span><span class="ass ${q.assunto}">${esc(D.assuntos[q.assunto])}</span><span>${esc(q.tema)}</span></div>` +
    `<div class="enun">${par(q.enunciado)}</div><div class="comando">${neg(q.comando)}</div>` +
    L.map(x => { let c = 'alt'; if (rev) { if (x === q.gab) c += ' certa'; else if (st.marc[i] === x) c += ' errada'; } else if (st.marc[i] === x) c += ' marcada';
      return `<button class="${c}" data-alt="${x}" id="alt${x}"><span class="l">${x}</span><span class="txt">${neg(q.alts[x])}</span><span class="com ${vis.has(x) ? 'on' : ''}" id="com${x}">${neg(q.coment[x])}</span></button>`; }).join('') +
    `<div class="dica ${p > L.length ? 'on' : ''}" id="dica"><b>💡 Dica do professor:</b> ${neg(q.dica)}</div>` +
    `<div class="passo"><button class="bt sec" id="bAnt">← Anterior</button><span>${rev ? (p <= L.length ? `Comentário ${Math.min(p, 5)} de 5` : 'Questão comentada') : (st.marc[i] ? `Turma marcou ${st.marc[i]}` : 'Marque a resposta da turma (A a E)')}</span>` +
    `<button class="bt" id="bProx">${!rev ? 'Revelar gabarito →' : p < L.length ? 'Próximo comentário →' : p === L.length ? 'Dica do professor →' : (i < Q.length - 1 ? 'Próxima questão →' : 'Ver o placar →')}</button></div></section>`;
  placar(); salvar();
  if (rolar) {
    const alvo = !rev ? $('qcard') : p === 0 ? $('alt' + q.gab) : p > L.length ? $('dica') : $('alt' + ord[p - 1]);
    setTimeout(() => alvo && alvo.scrollIntoView({ block: alvo.offsetHeight > innerHeight * .8 ? 'start' : 'center', behavior: 'smooth' }), 40);
  }
}
function ir(i) { st.q = i; mostrar(false); scrollTo(0, 0); }
function fim() {
  st.q = Q.length; salvar(); placar();
  let ok = 0, no = 0, sem = 0; Q.forEach((q, i) => { if (!st.marc[i] || !st.rev[i]) sem++; else if (st.marc[i] === q.gab) ok++; else no++; });
  const por = a => { const idx = Q.map((q, i) => i).filter(i => Q[i].assunto === a); return `${idx.filter(i => st.rev[i] && st.marc[i] === Q[i].gab).length} de ${idx.length}`; };
  $('palco').innerHTML = `<section class="cartao capa"><div class="rot">Fim da aula</div><h2>Placar da turma: ${ok} acerto${ok === 1 ? '' : 's'} em ${Q.length}</h2>` +
    `<p>${Object.keys(D.assuntos).map(a => `<b>${esc(D.assuntos[a])}:</b> ${por(a)}`).join(' · ')}${no ? ` · <b>Erros:</b> ${no}` : ''}${sem ? ` · <b>Sem resposta marcada:</b> ${sem}` : ''}</p>` +
    `<div class="passo"><button class="bt sec" id="bZerar">Zerar respostas</button>${R.length ? '<button class="bt sec" id="bRev">📚 Revisão visual</button>' : ''}<button class="bt" id="bLista">Lista de questões</button></div></section>`;
}
function avancar() {
  const i = st.q; if (i < 0) return ir(0); if (i >= Q.length) return;
  if (!st.rev[i]) { st.rev[i] = 1; st.passo[i] = 0; return mostrar(true); }
  if ((st.passo[i] || 0) <= L.length) { st.passo[i] = (st.passo[i] || 0) + 1; return mostrar(true); }
  if (i < Q.length - 1) ir(i + 1); else fim();
}
function voltar() {
  const i = st.q; if (i >= Q.length) return ir(Q.length - 1); if (i < 0) return;
  if (st.rev[i] && (st.passo[i] || 0) > 0) { st.passo[i]--; return mostrar(true); }
  if (st.rev[i]) { st.rev[i] = 0; return mostrar(true); }
  if (i > 0) { st.q = i - 1; mostrar(false); scrollTo(0, 0); } else capa();
}
function marcar(x) { const i = st.q; if (i < 0 || i >= Q.length || st.rev[i]) return; st.marc[i] = st.marc[i] === x ? undefined : x; mostrar(false); }
function tudo() { const i = st.q; if (i < 0 || i >= Q.length) return; st.rev[i] = 1; st.passo[i] = L.length + 1; mostrar(true); }
/* ---------- revisão visual (imagens do professor, com as correções embaixo) ---------- */
const R = D.revisao || [];
const errHtml = r => r.erratas && r.erratas.length ? `<div class="errata"><b>⚠ Corrija na imagem:</b><ul>${r.erratas.map(e => `<li>${neg(e)}</li>`).join('')}</ul></div>` : `<div class="semerro">✔ Conferida: sem correções.</div>`;
function revisao() {
  st.q = -2; salvar(); placar();

    var av = paleta.querySelector('.grf-aviso'); if (av) { av.hidden = true; av.textContent = ''; }
  }
  function escolher(f) {
    ferramenta = f;
    if (!paleta) return;
    var bs = paleta.querySelectorAll('[data-ferramenta]');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-ferramenta') === f ? 'true' : 'false');
    marcarCorpo();
  }
  function marcarCorpo() {
    var c = document.body.classList, aberta = paleta && !paleta.hidden;
    CORES.forEach(function (x) { c.remove('grf-cor-' + x.id); });
    c.remove('grf-borracha');
    document.documentElement.classList.toggle('grf-reserva', !!aberta);
    if (!aberta) return;
    if (ferramenta === 'borracha') c.add('grf-borracha'); else c.add('grf-cor-' + ferramenta);
  }
  function contar() {
    if (!paleta) return;
    var lista = ler(), vistos = 0;
    for (var i = 0; i < lista.length; i++) if (presente(lista[i].id)) vistos++;
    var fora = lista.length - vistos;
    var el = paleta.querySelector('.grf-conta');
    el.textContent = lista.length ? String(lista.length) : '';
    el.title = lista.length ? lista.length + ' grifo(s) nesta tela' + (fora ? ' (' + fora + ' fora da vista agora)' : '') : '';
  }
  function abrir() { montar().hidden = false; marcarCorpo(); contar(); }
  function fechar() { if (paleta) { paleta.hidden = true; rotuloLimpar(); } marcarCorpo(); }
  function alternar() { if (paleta && !paleta.hidden) fechar(); else abrir(); }
  function aviso(txt) { try { console.warn('[grifos] ' + txt); } catch (e) { /* sem console */ } if (paleta) paleta.querySelector('.grf-dica').textContent = txt; }
  function campo(el) {
    return !!el && (/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) || el.isContentEditable);
  }

  /* ---------- eventos ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || campo(e.target)) return;
    if (e.key === 'g' || e.key === 'G') { e.preventDefault(); alternar(); return; }
    if (e.key === 'Escape' && paleta && !paleta.hidden) fechar();
  });
  document.addEventListener('mouseup', function (e) {
    if (!paleta || paleta.hidden || ferramenta === 'borracha' || paleta.contains(e.target) || campo(e.target)) return;
    setTimeout(function () { grifarSelecao(ferramenta); }, 0);
  });
  document.addEventListener('click', function (e) {
    if (!paleta || paleta.hidden || ferramenta !== 'borracha') return;
    var m = e.target.closest && e.target.closest('mark.grf[data-grf]');
    if (!m) return;
    e.preventDefault(); e.stopPropagation();
    apagar(m.getAttribute('data-grf'));
  }, true);

  function iniciar() { estilo(); aplicar(); retomar(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();

  window.Grifa = { abrir: abrir, fechar: fechar, alternar: alternar, escolher: escolher, grifarSelecao: grifarSelecao,
    aplicar: aplicar, apagar: apagar, limparTela: limparTela, lista: ler, chave: CHAVE, cores: CORES };
})();

</script>
</body></html>
